plugins { id 'com.android.application' version '8.13.2' }

def endpoint = providers.gradleProperty('resolverUrl').orElse('').get()
def adApp = providers.gradleProperty('admobAppId').orElse('ca-app-pub-3956817331315524~2878774659').get()
def bannerId = providers.gradleProperty('bannerAdId').orElse('ca-app-pub-3956817331315524/6040783759').get()
android {
    namespace 'com.aqualotus.clipkeep'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aqualotus.clipkeep'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [adAppId: adApp]
        buildConfigField 'String', 'RESOLVER_URL', groovy.json.JsonOutput.toJson(endpoint)
        buildConfigField 'String', 'BANNER_ID', groovy.json.JsonOutput.toJson(bannerId)
    }
    buildTypes {
        debug {
            manifestPlaceholders = [adAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'BANNER_ID', '"ca-app-pub-3940256099942544/6300978111"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
